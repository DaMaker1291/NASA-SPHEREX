<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1280" viewBox="0 0 1800 1280">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#162033" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#5d718c"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#f97316"/>
    </marker>
    <style>
      text { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; }
      .kicker { font-size: 14px; font-weight: 700; letter-spacing: 2px; fill: #8b9bb4; }
      .tiny { font-size: 12px; font-weight: 600; letter-spacing: 1.3px; fill: #5a6a82; }
      .h1 { font-size: 44px; font-weight: 700; letter-spacing: -1.3px; fill: #e8eef7; }
      .sub { font-size: 17px; fill: #8b9bb4; }
      .node-title { font-size: 21px; font-weight: 650; fill: #e8eef7; }
      .node-detail { font-size: 15px; fill: #8b9bb4; }
      .node-tag { font-size: 12px; font-weight: 650; letter-spacing: .8px; }
      .section { font-size: 14px; font-weight: 700; letter-spacing: 2px; fill: #6f819b; }
      .card-title { font-size: 18px; font-weight: 700; fill: #e8eef7; }
      .card-body { font-size: 14px; fill: #8b9bb4; }
      .caption { font-size: 12px; fill: #5a6a82; }
      .arrow-label { font-size: 11px; font-weight: 650; letter-spacing: .8px; fill: #6f819b; }
    </style>
  </defs>

  <rect width="1800" height="1280" fill="#070b12"/>
  <rect width="1800" height="1280" fill="url(#grid)" opacity="0.45"/>
  <rect x="40" y="40" width="1720" height="1200" rx="26" fill="none" stroke="#1a2538"/>

  <!-- header -->
  <g>
    <text x="70" y="92" class="kicker" fill="#22d3ee">DRIFT / SPHEREX EXPLORER</text>
    <text x="70" y="150" class="h1">How the app works</text>
    <text x="70" y="184" class="sub">One request path from a target to a real detector cutout — even when IRSA search is down.</text>
    <g transform="translate(1320 78)">
      <rect width="190" height="36" rx="18" fill="#0d1b18" stroke="#1d4a3b"/>
      <circle cx="18" cy="18" r="5" fill="#34d399"/>
      <text x="32" y="23" class="node-tag" fill="#34d399">LIVE ON RENDER</text>
    </g>
    <g transform="translate(1524 78)">
      <rect width="204" height="36" rx="18" fill="#1b130b" stroke="#5a3a17"/>
      <circle cx="18" cy="18" r="5" fill="#f97316"/>
      <text x="32" y="23" class="node-tag" fill="#f97316">SIA2-INDEPENDENT</text>
    </g>
  </g>

  <!-- main panel -->
  <rect x="60" y="220" width="1680" height="650" rx="20" fill="#0a101c" stroke="#1a2538"/>
  <text x="90" y="252" class="section">REQUEST PATH · WHAT HAPPENS WHEN YOU HIT QUERY</text>
  <g transform="translate(1510 238)">
    <rect width="198" height="28" rx="14" fill="#0d1726" stroke="#20324a"/>
    <text x="14" y="19" class="node-tag" fill="#60a5fa">REAL DATA ONLY</text>
  </g>

  <!-- row 1 -->
  <!-- 01 UI -->
  <g>
    <rect x="90" y="285" width="240" height="130" rx="14" fill="#0c1220" stroke="#20324a"/>
    <rect x="90" y="285" width="4" height="130" rx="2" fill="#22d3ee"/>
    <text x="112" y="313" class="tiny" fill="#22d3ee">01 · UI</text>
    <text x="112" y="342" class="node-title">Choose a field</text>
    <text x="112" y="367" class="node-detail">Target preset or</text>
    <text x="112" y="387" class="node-detail">RA / Dec / FOV</text>
    <text x="112" y="404" class="node-tag" fill="#5a6a82">RENDER · FRONTEND/</text>
  </g>

  <!-- 02 request -->
  <g>
    <rect x="380" y="285" width="240" height="130" rx="14" fill="#0c1220" stroke="#20324a"/>
    <rect x="380" y="285" width="4" height="130" rx="2" fill="#f97316"/>
    <text x="402" y="313" class="tiny" fill="#f97316">02 · REQUEST</text>
    <text x="402" y="342" class="node-title">Fetch real visits</text>
    <text x="402" y="367" class="node-detail">/api/spherex/frames</text>
    <text x="402" y="387" class="node-detail">Hono on Render Node</text>
    <text x="402" y="404" class="node-tag" fill="#5a6a82">SAME ORIGIN · JSON</text>
  </g>

  <!-- 03 discover -->
  <g>
    <rect x="670" y="285" width="240" height="130" rx="14" fill="#0c1220" stroke="#20324a"/>
    <rect x="670" y="285" width="4" height="130" rx="2" fill="#f97316"/>
    <text x="692" y="313" class="tiny" fill="#f97316">03 · DISCOVER</text>
    <text x="692" y="342" class="node-title">Query the index</text>
    <text x="692" y="367" class="node-detail">manifest → cells →</text>
    <text x="692" y="387" class="node-detail">angular filter</text>
    <text x="692" y="404" class="node-tag" fill="#34d399">NO SIA2 CALL</text>
  </g>

  <!-- 04 index -->
  <g>
    <rect x="960" y="285" width="240" height="130" rx="14" fill="#0c1220" stroke="#20324a"/>
    <rect x="960" y="285" width="4" height="130" rx="2" fill="#a855f7"/>
    <text x="982" y="313" class="tiny" fill="#a855f7">04 · SPATIAL DATA</text>
    <text x="982" y="342" class="node-title">646 sky-cell shards</text>
    <text x="982" y="367" class="node-detail">71,319 DR1 pointings</text>
    <text x="982" y="387" class="node-detail">10° cells · checked in</text>
    <text x="982" y="404" class="node-tag" fill="#5a6a82">14 MB · STATIC ASSET</text>
  </g>

  <!-- 05 observations -->
  <g>
    <rect x="1250" y="285" width="450" height="130" rx="14" fill="#0c1220" stroke="#20324a"/>
    <rect x="1250" y="285" width="4" height="130" rx="2" fill="#60a5fa"/>
    <text x="1272" y="313" class="tiny" fill="#60a5fa">05 · OBSERVATIONS</text>
    <text x="1272" y="342" class="node-title">40 real visits for this field</text>
    <text x="1272" y="367" class="node-detail">Six detector products per pointing</text>
    <text x="1272" y="387" class="node-detail">D1 · D2 · D3 · D4 · D5 · D6</text>
    <text x="1272" y="404" class="node-tag" fill="#5a6a82">S3 PRODUCT KEYS RESOLVED</text>
  </g>

  <!-- row 1 arrows -->
  <line x1="330" y1="350" x2="372" y2="350" stroke="#5d718c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="350" x2="662" y2="350" stroke="#5d718c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="910" y1="350" x2="952" y2="350" stroke="#5d718c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1200" y1="350" x2="1242" y2="350" stroke="#5d718c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- down from observations -->
  <line x1="1475" y1="415" x2="1475" y2="517" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1490" y="472" class="arrow-label">VISIT LIST</text>

  <!-- row 2 -->
  <!-- 06 sample -->
  <g>
    <rect x="1250" y="530" width="450" height="130" rx="14" fill="#0c1220" stroke="#20324a"/>
    <rect x="1250" y="530" width="4" height="130" rx="2" fill="#60a5fa"/>
    <text x="1272" y="558" class="tiny" fill="#60a5fa">06 · SAMPLE</text>
    <text x="1272" y="587" class="node-title">12 real frames</text>
    <text x="1272" y="612" class="node-detail">Spread across the full visit span</text>
    <text x="1272" y="632" class="node-detail">D2 selected · 2025 → 2026</text>
    <text x="1272" y="649" class="node-tag" fill="#5a6a82">CAPPED FOR RESPONSIVENESS</text>
  </g>

  <!-- 07 image -->
  <g>
    <rect x="960" y="530" width="240" height="130" rx="14" fill="#0c1220" stroke="#20324a"/>
    <rect x="960" y="530" width="4" height="130" rx="2" fill="#f97316"/>
    <text x="982" y="558" class="tiny" fill="#f97316">07 · IMAGE</text>
    <text x="982" y="587" class="node-title">PNG request</text>
    <text x="982" y="612" class="node-detail">/api/spherex/png</text>
    <text x="982" y="632" class="node-detail">preferS3=1</text>
    <text x="982" y="649" class="node-tag" fill="#f97316">S3-FIRST</text>
  </g>

  <!-- 08 reader -->
  <g>
    <rect x="670" y="530" width="240" height="130" rx="14" fill="#0c1220" stroke="#20324a"/>
    <rect x="670" y="530" width="4" height="130" rx="2" fill="#f97316"/>
    <text x="692" y="558" class="tiny" fill="#f97316">08 · S3 READER</text>
    <text x="692" y="587" class="node-title">Byte-range FITS</text>
    <text x="692" y="612" class="node-detail">IMAGE · VARIANCE</text>
    <text x="692" y="632" class="node-detail">FLAGS · ZODI · WAVE</text>
    <text x="692" y="649" class="node-tag" fill="#5a6a82">NO CUTOUT SERVICE</text>
  </g>

  <!-- 09 pixels -->
  <g>
    <rect x="380" y="530" width="240" height="130" rx="14" fill="#0c1220" stroke="#20324a"/>
    <rect x="380" y="530" width="4" height="130" rx="2" fill="#a855f7"/>
    <text x="402" y="558" class="tiny" fill="#a855f7">09 · PIXELS</text>
    <text x="402" y="587" class="node-title">NASA IRSA S3</text>
    <text x="402" y="612" class="node-detail">public level-2 products</text>
    <text x="402" y="632" class="node-detail">65 MB per detector file</text>
    <text x="402" y="649" class="node-tag" fill="#5a6a82">AWS US-EAST-1 · NO AUTH</text>
  </g>

  <!-- 10 output -->
  <g>
    <rect x="90" y="530" width="240" height="130" rx="14" fill="#0c1220" stroke="#20324a"/>
    <rect x="90" y="530" width="4" height="130" rx="2" fill="#34d399"/>
    <text x="112" y="558" class="tiny" fill="#34d399">10 · OUTPUT</text>
    <text x="112" y="587" class="node-title">176 × 176 PNG</text>
    <text x="112" y="612" class="node-detail">asinh · iridescent</text>
    <text x="112" y="632" class="node-detail">6.14″ per pixel</text>
    <text x="112" y="649" class="node-tag" fill="#5a6a82">S3 DIRECT · REAL FITS</text>
  </g>

  <!-- row 2 arrows (right to left) -->
  <line x1="1250" y1="595" x2="1208" y2="595" stroke="#5d718c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="960" y1="595" x2="918" y2="595" stroke="#5d718c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="595" x2="628" y2="595" stroke="#5d718c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="595" x2="338" y2="595" stroke="#5d718c" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- output down -->
  <line x1="210" y1="660" x2="210" y2="753" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="226" y="713" class="arrow-label">IMAGE</text>

  <!-- row 3 viewer -->
  <g>
    <rect x="90" y="765" width="1610" height="76" rx="14" fill="#0c1220" stroke="#20324a"/>
    <rect x="90" y="765" width="4" height="76" rx="2" fill="#34d399"/>
    <text x="112" y="792" class="tiny" fill="#34d399">11 · BROWSER</text>
    <text x="112" y="822" class="node-title">Playback · blink · difference · zoom</text>
    <text x="680" y="800" class="node-detail">The viewer renders the real PNG and keeps the provenance badge visible.</text>
    <text x="680" y="822" class="node-detail">Source badge: S3 INDEX · S3 DIRECT · REAL FITS</text>
    <g transform="translate(1390 782)">
      <rect width="282" height="42" rx="21" fill="#0d1b18" stroke="#1d4a3b"/>
      <circle cx="22" cy="21" r="5" fill="#34d399"/>
      <text x="38" y="26" class="node-tag" fill="#34d399">NO IRSA SEARCH REQUIRED</text>
    </g>
  </g>

  <!-- footer sections -->
  <text x="90" y="920" class="section">HOW THE INDEX STAYS FRESH</text>
  <text x="650" y="920" class="section">HOW IT SHIPS</text>
  <text x="1170" y="920" class="section">WHAT IS STILL OPTIONAL</text>

  <!-- build card -->
  <g>
    <rect x="90" y="940" width="520" height="272" rx="16" fill="#0a101c" stroke="#1a2538"/>
    <rect x="90" y="940" width="4" height="272" rx="2" fill="#a855f7"/>
    <text x="114" y="973" class="card-title">Weekly index builder</text>
    <text x="114" y="1001" class="card-body">scripts/build-s3-index-full.mjs</text>

    <g transform="translate(114 1024)">
      <rect width="472" height="32" rx="8" fill="#0d1726" stroke="#20324a"/>
      <text x="12" y="21" class="caption">LIST BUCKET</text>
      <text x="144" y="21" class="caption">1,180 pages → 71,319 candidates</text>
    </g>
    <g transform="translate(114 1064)">
      <rect width="472" height="32" rx="8" fill="#0d1726" stroke="#20324a"/>
      <text x="12" y="21" class="caption">READ HEADERS</text>
      <text x="144" y="21" class="caption">32 KB range · RA / Dec / OBSID / date</text>
    </g>
    <g transform="translate(114 1104)">
      <rect width="472" height="32" rx="8" fill="#0d1726" stroke="#20324a"/>
      <text x="12" y="21" class="caption">WRITE SHARDS</text>
      <text x="144" y="21" class="caption">646 cells · complete manifest · 0 failures</text>
    </g>
    <text x="114" y="1170" class="card-body">GitHub Action · runs Mondays · commits the refreshed index</text>
    <text x="114" y="1192" class="caption">Checkpoint/resume protects long crawls from interruption.</text>
  </g>

  <!-- deploy card -->
  <g>
    <rect x="650" y="940" width="480" height="272" rx="16" fill="#0a101c" stroke="#1a2538"/>
    <rect x="650" y="940" width="4" height="272" rx="2" fill="#f97316"/>
    <text x="674" y="973" class="card-title">Push → Render</text>
    <text x="674" y="1001" class="card-body">GitHub main branch</text>

    <g transform="translate(674 1024)">
      <rect width="432" height="32" rx="8" fill="#0d1726" stroke="#20324a"/>
      <text x="12" y="21" class="caption">1 · git push origin main</text>
    </g>
    <g transform="translate(674 1064)">
      <rect width="432" height="32" rx="8" fill="#0d1726" stroke="#20324a"/>
      <text x="12" y="21" class="caption">2 · npm ci &amp;&amp; npm run build</text>
    </g>
    <g transform="translate(674 1104)">
      <rect width="432" height="32" rx="8" fill="#0d1726" stroke="#20324a"/>
      <text x="12" y="21" class="caption">3 · node server.mjs</text>
    </g>
    <text x="674" y="1170" class="card-body">Static frontend + Worker API from one service</text>
    <text x="674" y="1192" class="caption">Live: spherex-explorer-eq21.onrender.com</text>
  </g>

  <!-- fallback card -->
  <g>
    <rect x="1170" y="940" width="530" height="272" rx="16" fill="#0a101c" stroke="#1a2538"/>
    <rect x="1170" y="940" width="4" height="272" rx="2" fill="#60a5fa"/>
    <text x="1194" y="973" class="card-title">Fallbacks &amp; context</text>
    <text x="1194" y="1001" class="card-body">Not on the critical S3 path</text>

    <g transform="translate(1194 1024)">
      <rect width="482" height="32" rx="8" fill="#0d1726" stroke="#20324a"/>
      <text x="12" y="21" class="caption">SIA2 / TAP</text>
      <text x="154" y="21" class="caption">only if the index manifest is missing</text>
    </g>
    <g transform="translate(1194 1064)">
      <rect width="482" height="32" rx="8" fill="#0d1726" stroke="#20324a"/>
      <text x="12" y="21" class="caption">IRSA CUTOUT</text>
      <text x="154" y="21" class="caption">only if a specific S3 product fails</text>
    </g>
    <g transform="translate(1194 1104)">
      <rect width="482" height="32" rx="8" fill="#0d1726" stroke="#20324a"/>
      <text x="12" y="21" class="caption">HIPs · GAIA · ALLWISE</text>
      <text x="230" y="21" class="caption">optional context / overlays</text>
    </g>
    <text x="1194" y="1170" class="card-body">Local mirror and all-sky mosaic remain available offline.</text>
    <text x="1194" y="1192" class="caption">Core imagery does not wait on IRSA web search.</text>
  </g>

  <text x="1710" y="1240" text-anchor="end" class="caption">Source: repository code + checked-in S3 index · updated 2026-11-15</text>
</svg>
